# EUR Residual Test Configuration
# ========================================
# Tests EUR acquisition function with BaseGP keypoints warmup
# ========================================

[common]
parnames = ['x1_CeilingHeight', 'x2_GridModule', 'x3_OuterFurniture', 'x4_VisualBoundary', 'x5_PhysicalBoundary', 'x6_InnerFurniture']
stimuli_per_trial = 1
outcome_types = [continuous]
strategy_names = [init_strat, eur_strat]
# lb/ub: indices ranges for categorical parameters
lb = [0, 0, 0, 0, 0, 0]
ub = [2, 1, 2, 2, 1, 2]

# ========================================
# Parameter Definitions (MIXED TYPES)
# ========================================
# x1, x2: Numeric discrete → custom_ordinal_mono with values
# x3-x6: String categorical → categorical with choices
# ========================================

[x1_CeilingHeight]
par_type = custom_ordinal_mono
values = [2.8, 4.0, 8.5]

[x2_GridModule]
par_type = custom_ordinal_mono
values = [6.5, 8.0]

[x3_OuterFurniture]
par_type = categorical
choices = ['Chaos', 'Rotated', 'Strict']

[x4_VisualBoundary]
par_type = categorical
choices = ['Color', 'Solid', 'Translucent']

[x5_PhysicalBoundary]
par_type = categorical
choices = ['Closed', 'Open']

[x6_InnerFurniture]
par_type = categorical
choices = ['Chaos', 'Rotated', 'Strict']

# ========================================
# Warmup Strategy: Will be populated programmatically with BaseGP keypoints
# ========================================

[init_strat]
min_asks = 3
generator = ManualGenerator
refit_every = 4
model = GPRegressionModel

[ManualGenerator]
# Golden points from BaseGP will be injected dynamically
stimuli_per_trial = 1
shuffle = false

# ========================================
# EUR Sampling Strategy
# ========================================

[eur_strat]
min_asks = 50
max_asks = 100
refit_every = 1
model = GPRegressionModel
generator = CustomPoolBasedGenerator

[GPRegressionModel]
inducing_size = 100
max_fit_time = 5.0
mean_covar_factory = CustomBaseGPResidualFactory

[CustomBaseGPResidualFactory]
basegp_scan_csv = d:\ENVS\active-psych-sampling\extensions\warmup_budget_check\phase1_analysis_output\202512081445\step3\design_space_scan.csv
mean_type = pure_residual
lengthscale_prior = lognormal
ls_loc = [0.0166, -0.2634, 0.7133, -1.4744, 0.7983, 0.6391]
ls_scale = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
fixed_kernel_amplitude = False
outputscale_prior = gamma

[CustomPoolBasedGenerator]
acqf = EURAnovaMultiAcqf
# pool_points will be injected dynamically from design space
allow_resampling = False
shuffle = True

# ========================================
# EURAnovaMultiAcqf Configuration
# ========================================
# Advanced ANOVA-based acquisition function with dynamic weighting
# Designed for 6D mixed-type space: 2 ordinal + 4 categorical
# ========================================

[EURAnovaMultiAcqf]
# Variable Types (CRITICAL)
# Must match parameter order: x1, x2, x3, x4, x5, x6
variable_types_list = ordinal, ordinal, categorical, categorical, categorical, categorical

# ANOVA Decomposition Orders
enable_main = True
enable_pairwise = True
enable_threeway = False

# Dynamic Lambda (Interaction Weights)
# Automatically adjusts based on parameter variance ratio
lambda_2 = None
use_dynamic_lambda = True
lambda_min = 0.40
lambda_max = 0.70
tau1 = 0.55
tau2 = 0.08

# Dynamic Gamma (Coverage Weights)
# Automatically adjusts based on sample count
gamma = 0.20
use_dynamic_gamma = True
gamma_max = 0.30
gamma_min = 0.05
tau_n_min = 3
tau_n_max = 30
total_budget = 100

# SPS (Skeleton Prediction Stability)
# Critical for mixed ordinal+categorical spaces
use_sps = True
sps_sensitivity = 8.0
sps_ema_alpha = 0.3
tau_safe = 0.5
gamma_penalty_beta = 0.3

# Sampling Methods
coverage_method = min_distance
fusion_method = additive

# Local Sampling
local_num = 6
local_jitter_frac = 0.1
random_seed = 42

# Hybrid Perturbation (Discrete Variables)
use_hybrid_perturbation = True
exhaustive_level_threshold = 3
exhaustive_use_cyclic_fill = True

# Debug
debug_components = False
