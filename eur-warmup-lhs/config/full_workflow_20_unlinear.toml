# EUR-Warmup Full Workflow Configuration
# 这是一个完整的全流程配置文件，你可以手动修改后在 CLI 中选择使用。

[step1]
# Step 1: Warmup Sampling Configuration
auto_confirm = false # 是否自动确认预算评估 (如果为 false，则会暂停等待用户确认)
# core2a_method = "oa" # 主效应采样方法: "d-optimal" (信息量最大化), "stratified" (均匀覆盖) 或 "oa" (正交/均衡)
design_csv = 'D:\ENVS\active-psych-sampling\data\source_data_normalized_minus1to1.csv' # 使用 [-1, 1] 归一化空间
interaction_mode = "specified_only" # 交互模式: free (自由探索), specified_only (仅指定), hybrid (混合)
interaction_pairs = [
  [0, 2],
  [0, 3],
] # 预热阶段重点探索的交互对索引列表
# main_effects_first = true
merge = false # 是否将所有被试的采样合并到一个CSV文件
# n_core1 = 4
n_subjects = 5 # 暂设为 5 个被试进行测试
output_dir = "sample"
repeat_one_point = true
skip_interaction = false # 开启交互采样以测试非线性恢复
trials_per_subject = 15

[step1_5]
# Step 1.5: Simulation Configuration
# Main effect weights for 6 features (must match oracle weights for consistency)
weights = [0.19868566120449307, -0.055305720468473867, 0.259075415240277, 0.65, -0.09366134988933439, -0.09365478277967222]

individual_std_percent = 0.2
interaction_pairs = [[0, 2], [0, 3]]
likert_levels = 7
likert_mode = "tanh"
likert_sensitivity = 1.5
model_type = "nonlinear_tanh" # ⭐ 设置为非线性模型
noise_std = 0.1
output_type = "likert"
population_mean = 0.0
population_std = 0.4
response_col = "y"
seed = 42

[oracle.nonlinear_tanh]
bias = 0.0
# Population weights - MODIFIED: U-shape now on x3 with strong weight
func_configs = [
  {type = "tanh", k = 1.5}, # x0 (x1_CeilingHeight) - tanh
  {type = "linear"}, # x1 (x2_GridModule) - linear
  {type = "tanh", k = 2.0}, # x2 (x3_OuterFurniture) - CHANGED: tanh (was u_shape)
  {type = "u_shape", c = 0.0}, # x3 (x4_VisualBoundary) - CHANGED: u_shape (was tanh)
  {type = "linear"}, # x4 (x5_PhysicalBoundary) - linear
  {type = "tanh", k = 1.0}, # x5 (x6_InnerFurniture) - tanh
]
# MODIFIED: x3 now has strong U-shape weight (0.65, strongest effect)
weights = [
  0.70, # x0: tanh, strengthened from 0.20 to 0.35
  -0.05, # x1: linear, INSIGNIFICANT (test FDR control)
  0.45, # x2: tanh, strengthened from 0.26 to 0.45
  0.35, # x3: u_shape, STRONG (slightly increased from 0.65)
  -0.25, # x4: linear, strengthened from -0.15 to -0.25
  -0.25, # x5: tanh, strengthened from -0.15 to -0.25
]

[oracle.nonlinear_tanh.interaction_weights]
"0,2" = 0.6 # x0 * x2 (tanh * tanh)
"0,3" = -0.4 # x0 * x3 (tanh * u_shape) ← Now involves U-shape!

[step2]
# Step 2: Analysis & Specification Configuration
max_pairs = 4
min_pairs = 2
response_col = "y"
selection_method = "elbow"
subject_col = "subject_id"
suspected_pairs = [[0, 2], [0, 3], [1, 3]]

[step3]
# Step 3: Base GP Training Configuration
ensure_diversity = true
learning_rate = 0.05
max_iters = 1000 # 增加迭代次数以更好地拟合非线性
response_col = "y"
subject_col = "subject_id"
use_cuda = false

# --- 高级核函数配置 ---
kernel_type = "custom_anova"
y_normalization_type = "zscore"

interaction_mode = "list" # 仅对指定的交互项进行先验学习
interaction_pairs = [[0, 2], [0, 3]]
# kernel_combination = "full"

# 维度规格
dim_specs = [
  {name = "x1_CeilingHeight", type = "continuous"},
  {name = "x2_GridModule", type = "continuous"},
  {name = "x3_OuterFurniture", type = "discrete", n_categories = 3},
  {name = "x4_VisualBoundary", type = "discrete", n_categories = 3},
  {name = "x5_PhysicalBoundary", type = "discrete", n_categories = 2},
  {name = "x6_InnerFurniture", type = "discrete", n_categories = 3},
]

# 交互项收缩先验 (Interaction Shrinkage) - 适度收缩，平衡主效应与交互项
interaction_initial_scale = 0.1
interaction_shrink_loc = -1.5
interaction_shrink_scale = 0.5
