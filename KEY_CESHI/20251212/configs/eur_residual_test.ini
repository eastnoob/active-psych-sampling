[common]
parnames = [x1_CeilingHeight, x2_GridModule, x3_OuterFurniture, x4_VisualBoundary, x5_PhysicalBoundary, x6_InnerFurniture]
stimuli_per_trial = 1
outcome_types = [binary]
strategy_names = [init_strat, eur_strat]

[x1_CeilingHeight]
par_type = continuous
lower_bound = 2.8
upper_bound = 8.5

[x2_GridModule]
par_type = continuous
lower_bound = 6.5
upper_bound = 8.0

[x3_OuterFurniture]
par_type = ordinal
values = [Chaos, Rotated, Strict]

[x4_VisualBoundary]
par_type = ordinal
values = [Color, Solid, Translucent]

[x5_PhysicalBoundary]
par_type = ordinal
values = [Closed, Open]

[x6_InnerFurniture]
par_type = ordinal
values = [Chaos, Rotated, Strict]

[init_strat]
min_asks = 3
generator = OptimizeAcqfGenerator
acqf = qLogNoisyExpectedImprovement
model = MonotonicRejectionGP

[MonotonicRejectionGP]
ls_prior = gamma
ls_prior_concentration = 3.0
ls_prior_rate = 1.0
covar_module = RBFKernelPartialObsGrad
mean_covar_factory = monotonic_mean_covar_factory

[eur_strat]
min_asks = 50
generator = DynamicEURGenerator
acqf = DynamicEURFunction
model = MonotonicRejectionGP
refit_every = 1

[DynamicEURGenerator]
max_uncertainty = 0.95
max_divergence = 0.95
initial_uncertainty_weight = 0.5
initial_divergence_weight = 0.5
min_weight = 0.01
max_weight = 0.99
weight_update_lr = 0.1
weight_decay = 0.95
acqf_batch_size = 256

[DynamicEURFunction]
target_level = 0.75
