[common]
parnames = ['x1_CeilingHeight', 'x2_GridModule', 'x3_OuterFurniture', 'x4_VisualBoundary', 'x5_PhysicalBoundary', 'x6_InnerFurniture']
stimuli_per_trial = 1
outcome_types = [continuous]
strategy_names = [sobol_strat]
lb = [0, 0, 0, 0, 0, 0]
ub = [2, 1, 2, 2, 1, 2]

[x1_CeilingHeight]
par_type = custom_ordinal_mono
values = [2.8, 4.0, 8.5]

[x2_GridModule]
par_type = custom_ordinal_mono
values = [6.5, 8.0]

[x3_OuterFurniture]
par_type = categorical
choices = ['Chaos', 'Rotated', 'Strict']

[x4_VisualBoundary]
par_type = categorical
choices = ['Color', 'Solid', 'Translucent']

[x5_PhysicalBoundary]
par_type = categorical
choices = ['Closed', 'Open']

[x6_InnerFurniture]
par_type = categorical
choices = ['Chaos', 'Rotated', 'Strict']


[sobol_strat]
min_asks = 15
generator = SobolGenerator
model = GPRegressionModel


