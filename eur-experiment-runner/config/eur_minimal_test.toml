# EUR Minimal Test - KEY_CESHI 1:1 Replication
# 最小测试配置

[experiment]
name = "EUR Minimal Test"
output_dir = "output/eur_minimal_test"

[oracle]
type = "linear"
seed = 42
noise_std = 0.77
output_type = "continuous"

[oracle.linear]
bias = 0.0

[role]
type = "eur"

[role.eur]
ini_config_path = "config/eur_strategy_template.ini"

[behavior]
type = "single_run"

[behavior.single_run]
budget = 8  # 3 warmup + 5 EUR
warmup_points = 3

# Parameter definitions matching KEY_CESHI
[parameters]
x1_CeilingHeight = { par_type = "custom_ordinal_mono", values = [2.8, 4.0, 8.5] }
x2_GridModule = { par_type = "custom_ordinal_mono", values = [6.5, 8.0] }
x3_OuterFurniture = { par_type = "categorical", choices = ["Chaos", "Rotated", "Strict"] }
x4_VisualBoundary = { par_type = "categorical", choices = ["Color", "Solid", "Translucent"] }
x5_PhysicalBoundary = { par_type = "categorical", choices = ["Closed", "Open"] }
x6_InnerFurniture = { par_type = "categorical", choices = ["Chaos", "Rotated", "Strict"] }
